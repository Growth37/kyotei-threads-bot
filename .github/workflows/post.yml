name: 競艇予想をThreadsに投稿

on:
  schedule:
    # UTC表記 (JST-9時間)。毎日 12:05 / 14:40 / 17:20 JST の3回
    # (2号と時間が被らないよう不規則間隔に調整)
    # 各回に25分後のバックアップ実行あり (取りこぼし対策。二重投稿ガードでスキップ)
    - cron: '5 3 * * *'
    - cron: '30 3 * * *'
    - cron: '40 5 * * *'
    - cron: '5 6 * * *'
    - cron: '20 8 * * *'
    - cron: '45 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'お試し実行 (1=投稿せず内容表示のみ)'
        required: false
        default: '0'

concurrency:
  group: post-r-no-yosou
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ランダム待機 (投稿時刻を毎回ずらして機械的パターンを避ける)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 600))
          echo "${DELAY}秒待機します"
          sleep $DELAY
      - name: 予想を生成してThreadsに投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python post_prediction.py
      - name: 投稿ログをコミット
        run: |
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          [ -f posts_log.json ] && git add posts_log.json; true
          if git diff --cached --quiet; then
            echo "ログ変更なし"
            exit 0
          fi
          git commit -m "log: 投稿記録を更新"
          git pull --rebase origin main
          git push
