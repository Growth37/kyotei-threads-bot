name: 競艇予想をThreadsに投稿

on:
  schedule:
    # UTC表記 (JST-9時間)。月〜金の 11:37 / 15:08 / 18:02 JST
    # 各回に25分後のバックアップ実行あり (GitHubのスケジュール取りこぼし対策。
    # 本体が実行済みならスクリプト側の二重投稿ガードでスキップされる)
    - cron: '37 2 * * 1-5'
    - cron: '2 3 * * 1-5'
    - cron: '8 6 * * 1-5'
    - cron: '33 6 * * 1-5'
    - cron: '2 9 * * 1-5'
    - cron: '27 9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'お試し実行 (1=投稿せず内容表示のみ)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 予想を生成してThreadsに投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python post_prediction.py
      - name: 投稿ログをコミット
        run: |
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          [ -f posts_log.json ] && git add posts_log.json; true
          if git diff --cached --quiet; then
            echo "ログ変更なし"
            exit 0
          fi
          git commit -m "log: 投稿記録を更新"
          git pull --rebase origin main
          git push
