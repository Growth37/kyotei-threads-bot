name: 競艇予想をThreadsに投稿

on:
  schedule:
    # UTC表記 (JST-9時間)。月〜金の 09:00 / 11:30 / 14:00 / 16:30 / 19:00 JST
    - cron: '0 0 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '0 5 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'お試し実行 (1=投稿せず内容表示のみ)'
        required: false
        default: '0'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 予想を生成してThreadsに投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python post_prediction.py
