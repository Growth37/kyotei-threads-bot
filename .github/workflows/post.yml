name: 競艇予想をThreadsに投稿

on:
  schedule:
    # UTC表記 (JST-9時間)。月〜金の 11:37 / 15:08 / 18:02 JST
    - cron: '37 2 * * 1-5'
    - cron: '8 6 * * 1-5'
    - cron: '2 9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'お試し実行 (1=投稿せず内容表示のみ)'
        required: false
        default: '0'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 予想を生成してThreadsに投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python post_prediction.py
