name: 表示回数と的中チェック

on:
  schedule:
    # JST 11:08〜22:48 を20分おき (毎日)。実行分を:08/:28/:48にずらし取りこぼし対策。
    # 的中投稿をレース確定後まもなく(締切+25分以降)出すため頻度を上げている。
    - cron: '8,28,48 2-13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依存ライブラリ
        run: pip install openpyxl --quiet
      - name: 表示回数の記録と的中チェック
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python track_metrics.py
      - name: 結果をコミット
        run: |
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          for f in posts_log.json metrics.csv metrics.xlsx; do
            [ -f "$f" ] && git add "$f"
          done; true
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "metrics: 表示回数/的中結果を更新"
          git pull --rebase origin main
          git push
