name: 競艇予想をThreadsに投稿(2号 @shantianzhi37)

on:
  schedule:
    # UTC表記 (JST-9時間)。毎日 10:14 / 11:41 / 13:26 / 15:12 / 18:41 JST
    # (1号と時間が被らないよう不規則間隔に調整)
    # 各回に+25分のバックアップ実行あり(取りこぼし対策。二重投稿ガードでスキップ)
    - cron: '14 1 * * *'    # 10:14 JST
    - cron: '39 1 * * *'    # 10:39 JST (backup)
    - cron: '41 2 * * *'    # 11:41 JST (堅い固定)
    - cron: '6 3 * * *'     # 12:06 JST (backup)
    - cron: '26 4 * * *'    # 13:26 JST
    - cron: '51 4 * * *'    # 13:51 JST (backup)
    - cron: '12 6 * * *'    # 15:12 JST (堅い固定)
    - cron: '37 6 * * *'    # 15:37 JST (backup)
    - cron: '41 9 * * *'    # 18:41 JST
    - cron: '6 10 * * *'    # 19:06 JST (backup)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'お試し実行 (1=投稿せず内容表示のみ)'
        required: false
        default: '0'

concurrency:
  group: post-shantianzhi37
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ランダム待機 (投稿時刻を毎回ずらして機械的パターンを避ける)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 600))
          echo "${DELAY}秒待機します"
          sleep $DELAY
      - name: 予想を生成してThreadsに投稿
        env:
          THREADS_ACCESS_TOKEN_2: ${{ secrets.THREADS_ACCESS_TOKEN_2 }}
          X_API_KEY_2: ${{ secrets.X_API_KEY_2 }}
          X_API_SECRET_2: ${{ secrets.X_API_SECRET_2 }}
          X_ACCESS_TOKEN_2: ${{ secrets.X_ACCESS_TOKEN_2 }}
          X_ACCESS_SECRET_2: ${{ secrets.X_ACCESS_SECRET_2 }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python post_prediction_2.py
      - name: 投稿ログをコミット
        run: |
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          [ -f posts_log_2.json ] && git add posts_log_2.json; true
          if git diff --cached --quiet; then
            echo "ログ変更なし"
            exit 0
          fi
          git commit -m "log: 2号の投稿記録を更新"
          git pull --rebase origin main
          git push
