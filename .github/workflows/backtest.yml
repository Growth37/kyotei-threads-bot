name: 予想ロジックのバックテスト

on:
  workflow_dispatch:
    inputs:
      days:
        description: '検証する過去日数'
        required: false
        default: '60'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: バックテスト実行
        env:
          DAYS: ${{ github.event.inputs.days || '60' }}
        run: python backtest.py
