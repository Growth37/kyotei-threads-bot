name: Threadsトークンを自動更新

on:
  schedule:
    # 毎週月曜 12:00 JST (3:00 UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 長期トークンをリフレッシュしてSecretを更新
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          pip install pynacl requests --quiet
          python - <<'EOF'
          import os, requests
          from base64 import b64encode
          from nacl import encoding, public

          token = os.environ["THREADS_ACCESS_TOKEN"]
          r = requests.get(
              "https://graph.threads.net/refresh_access_token",
              params={"grant_type": "th_refresh_token", "access_token": token},
              timeout=30,
          )
          r.raise_for_status()
          new_token = r.json()["access_token"]
          print("トークンのリフレッシュに成功")

          gh = os.environ["GH_PAT"]
          repo = os.environ["REPO"]
          headers = {"Authorization": f"Bearer {gh}", "Accept": "application/vnd.github+json"}
          key = requests.get(
              f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
              headers=headers, timeout=30,
          ).json()
          pk = public.PublicKey(key["key"].encode(), encoding.Base64Encoder())
          sealed = b64encode(public.SealedBox(pk).encrypt(new_token.encode())).decode()
          res = requests.put(
              f"https://api.github.com/repos/{repo}/actions/secrets/THREADS_ACCESS_TOKEN",
              headers=headers,
              json={"encrypted_value": sealed, "key_id": key["key_id"]},
              timeout=30,
          )
          res.raise_for_status()
          print("Secretの更新に成功")
          EOF
